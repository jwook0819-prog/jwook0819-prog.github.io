<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>play</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b12;overflow:hidden}
  #phone{position:absolute;left:0;top:0;width:480px;height:1040px;transform-origin:0 0;transform:scale(0.94)}
  iframe{width:480px;height:1040px;border:0;display:block}
</style></head>
<body><div id="phone"><iframe id="g"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var args = [];
  ['pass','c','lang','intro'].forEach(function(k){ if(p.get(k)) args.push(k+'='+encodeURIComponent(p.get(k))); });
  document.getElementById('g').src = 'index.html' + (args.length ? '?' + args.join('&') : '');
</script>
</body></html>

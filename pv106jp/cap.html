<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>cap</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b12;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1872px;height:864px}
  iframe{position:absolute;left:0;top:0;width:480px;height:1040px;border:0;
         transform-origin:0 0;transform:translateX(1872px) rotate(90deg) scale(1.8)}
</style></head>
<body><div id="stage"><iframe id="g"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var args = [];
  ['pass','c','lang','intro'].forEach(function(k){ if(p.get(k)) args.push(k+'='+encodeURIComponent(p.get(k))); });
  document.getElementById('g').src = 'index.html' + (args.length ? '?' + args.join('&') : '');
</script>
</body></html>

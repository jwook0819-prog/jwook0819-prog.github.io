<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>seed</title></head>
<body>
<script>
/* 캡처용 저장값 시드: 진행도만 심고 play.html 로 넘어간다 (1.0.6 빌드 화면은 그대로) */
(function () {
  var q = new URLSearchParams(location.search)
  var c = q.get('c') || 'korea'
  var lang = q.get('lang') || 'ko'
  var intro = q.get('intro') === '1'
  var CIDS = ['korea', 'japan', 'france', 'usa', 'brazil', 'australia', 'newzealand', 'canada']
  var per = function (f) { var o = {}; CIDS.forEach(function (id) { o[id] = f(id) }); return o }
  var idx = CIDS.indexOf(c)
  var progress = per(function (id) {
    var st = new Array(20).fill(0)
    if (CIDS.indexOf(id) < idx) { for (var i = 0; i < 20; i++) st[i] = 3 }
    else if (id === c) { for (var j = 0; j < 19; j++) st[j] = 3 }
    return { stars: st }
  })
  var save = {
    version: 5, createdAt: Date.now(), coins: 9000, paid: [], inserted: 0, insertedFor: '',
    stageLeft: per(function () { return {} }), lastRefill: Date.now(),
    progress: progress,
    countries: per(function (id) { return { cleared: CIDS.indexOf(id) < idx, rewarded: true, stamp: true, clearedAt: 0 } }),
    stageKept: per(function () { return {} }), stagePlays: per(function () { return {} }),
    collection: {}, dexClaimed: per(function () { return false }),
    settings: { quality: 'high', qualityManual: true, perfLevel: 3, lang: lang, vibration: false, music: false, sfx: false },
    tutorialDone: true,
    fxIntroSeen: intro ? [] : CIDS.slice()
  }
  localStorage.setItem('omg_test_gate_pass', '0819')
  localStorage.setItem('omg_save_bak', JSON.stringify(save))
  localStorage.setItem('omg_save', JSON.stringify(save))
  if (q.get('stay')) {
    document.body.innerHTML = '<pre style="font:14px monospace">' + JSON.stringify(save.progress[c].stars) + '\ncoins=' + save.coins + '</pre>'
    return
  }
  location.replace('play.html?pass=0819&c=' + encodeURIComponent(c) + '&lang=' + encodeURIComponent(lang))
})()
</script>
</body></html>

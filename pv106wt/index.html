    <!-- 구형 Android 시스템 WebView 안내 (2026-10-29, 갤럭시 S8 실기기: 로딩 화면이 작은 상자로 그려지고 0% 에서 멈춤).
         번들이 ES2022 문법(≈Chrome 94+)과 CSS inset(Chrome 87+)을 쓰므로, 오래된 WebView 에서는 앱 코드가 아예 실행되지 않는다.
         그래서 이 스크립트는 일부러 ES5 로만 쓴 평범한 <script> 다 (번들·모듈과 무관하게 실행됨).
         ① 필요한 기능이 없으면 바로, ② 앱이 20초 안에 시작 신호(window.__ommBoot)를 못 주면 안내 화면을 덮어 씌운다. 정상 기기에서는 아무 일도 하지 않는다. -->
    <script>
      ;(function () {
        function lacks() {
          var miss = []
          try {
            if (!(window.CSS && CSS.supports && CSS.supports('inset', '0'))) miss.push('css-inset')
          } catch (e) { miss.push('css-inset') }
          try { new Function('class A{static x=1;#p=2;static{}}') } catch (e) { miss.push('es2022') }
          if (typeof Array.prototype.at !== 'function') miss.push('array-at')
          if (typeof Object.hasOwn !== 'function') miss.push('object-hasown')
          if (typeof WebAssembly !== 'object') miss.push('wasm')
          return miss
        }
        var shown = false
        // old = true: WebView 가 오래된 것이 확실함(기능 부족·Chrome 100 미만) → 업데이트 안내. false: 그냥 시작이 안 됨 → 다시 시도만
        function show(why, old) {
          if (shown) return
          shown = true
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent)
          var d = document.createElement('div')
          d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;background:#3a1f6e;color:#fff;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;font-family:sans-serif')
          var btn = 'display:block;margin:10px auto 0;padding:13px 22px;border-radius:14px;border:0;font-size:16px;font-weight:700;width:100%;max-width:320px;'
          d.innerHTML =
            '<div style="max-width:340px">' +
            (old
              ? '<div style="font-size:21px;font-weight:800;margin-bottom:12px">WebView 업데이트가 필요해요</div>' +
                '<div style="font-size:14px;line-height:1.55;opacity:.95">이 휴대폰의 &#39;Android 시스템 WebView&#39;가 오래돼서 게임을 실행할 수 없어요.<br>Play 스토어에서 <b>Android System WebView</b>(또는 <b>Chrome</b>)를 업데이트한 뒤 다시 실행해 주세요.</div>' +
                '<div style="font-size:12px;line-height:1.5;opacity:.75;margin-top:10px">Your Android System WebView is out of date. Please update it in the Play Store and reopen the game.</div>' +
                '<button id="omm-upd" style="' + btn + 'background:#ffd54a;color:#3a1f6e">업데이트하러 가기</button>'
              : '<div style="font-size:21px;font-weight:800;margin-bottom:12px">게임을 시작하지 못했어요</div>' +
                '<div style="font-size:14px;line-height:1.55;opacity:.95">잠시 후 다시 시도해 주세요. 계속 안 되면 앱을 완전히 종료했다가 다시 실행해 주세요.</div>') +
            '<button id="omm-rty" style="' + btn + 'background:rgba(255,255,255,.18);color:#fff">다시 시도</button>' +
            '<div style="font-size:11px;opacity:.55;margin-top:12px">Chrome/' + (m ? m[1] : '?') + ' · ' + why + '</div>' +
            '</div>'
          document.body.appendChild(d)
          var upd = document.getElementById('omm-upd')
          if (upd) upd.onclick = function () {
            location.href = 'https://play.google.com/store/apps/details?id=com.google.android.webview'
          }
          document.getElementById('omm-rty').onclick = function () { location.reload() }
        }
        function chromeMajor() {
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent)
          return m ? parseInt(m[1], 10) : 0
        }
        document.addEventListener('DOMContentLoaded', function () {
          var miss = lacks()
          if (miss.length) show(miss.join(','), true)
        })
        window.setTimeout(function () {
          if (window.__ommBoot) return
          var miss = lacks()
          var cm = chromeMajor()
          show(miss.length ? miss.join(',') : 'boot-timeout', miss.length > 0 || (cm > 0 && cm < 100))
        }, 20000)
      })()
    </script>
    <!-- 개발자 비공개 테스트 게이트 (PIN: 0819) -->
    <style>#omm-gate{z-index:2147483646;color:#fff;box-sizing:border-box;-webkit-user-select:none;user-select:none;background:radial-gradient(circle at 50% 32%,#3a1f6e 0%,#150d2a 100%);flex-direction:column;justify-content:center;align-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Pretendard,sans-serif;transition:opacity .35s ease-out;display:flex;position:fixed;inset:0}#omm-gate.unlocked{opacity:0;pointer-events:none}.gate-card{-webkit-backdrop-filter:blur(20px);text-align:center;box-sizing:border-box;background:#ffffff14;border:1.5px solid #ffffff38;border-radius:28px;flex-direction:column;align-items:center;width:100%;max-width:320px;padding:30px 22px 26px;display:flex;box-shadow:0 20px 50px #00000080,inset 0 1px 1px #fff6}.gate-icon{background:linear-gradient(135deg,#ffd54a,#ff9a2e);border-radius:18px;justify-content:center;align-items:center;width:60px;height:60px;margin-bottom:14px;font-size:30px;display:flex;box-shadow:0 8px 24px #ffb22e59}.gate-title{color:#fff;letter-spacing:-.3px;margin-bottom:5px;font-size:19px;font-weight:800}.gate-sub{color:#ffffffb8;margin-bottom:22px;font-size:13px}.gate-dots{gap:14px;margin-bottom:24px;display:flex}.gate-dot{box-sizing:border-box;background:#ffffff0f;border:2px solid #ffffff59;border-radius:50%;width:16px;height:16px;transition:all .2s cubic-bezier(.4,0,.2,1)}.gate-dot.fill{background:#ffd54a;border-color:#ffd54a;transform:scale(1.15);box-shadow:0 0 14px #ffd54a}.gate-pad{grid-template-columns:repeat(3,1fr);gap:10px;width:100%;display:grid}.gate-btn{color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#ffffff1a;border:1px solid #ffffff29;border-radius:16px;justify-content:center;align-items:center;height:52px;font-family:inherit;font-size:22px;font-weight:700;transition:all .1s;display:flex}.gate-btn:active{background:#ffffff47;transform:scale(.93)}.gate-btn.action{color:#ffffffa6;background:0 0;border-color:#0000;font-size:14px}.gate-err{color:#ff5d8f;min-height:18px;margin-top:14px;font-size:13px;font-weight:700}.gate-card.shake{animation:.4s ease-in-out gateShake}@keyframes gateShake{0%,to{transform:translate(0)}20%,60%{transform:translate(-8px)}40%,80%{transform:translate(8px)}}</style>
    <script>
      ;(function () {
        var isNative = false
        try {
          isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        } catch (e) {}
        if (isNative) return

        var KEY = 'omg_test_gate_pass'
        try {
          var p = new URLSearchParams(location.search)
          if (p.get('pass') === '0819') localStorage.setItem(KEY, '0819')
          if (localStorage.getItem(KEY) === '0819') return
        } catch (e) {}

        document.addEventListener('DOMContentLoaded', function () {
          if (document.getElementById('omm-gate')) return
          var el = document.createElement('div')
          el.id = 'omm-gate'
          el.innerHTML =
            '<div class="gate-card">' +
            '  <div class="gate-icon">🔒</div>' +
            '  <div class="gate-title">개발자 비공개 테스트</div>' +
            '  <div class="gate-sub">비밀번호 4자리를 입력해 주세요</div>' +
            '  <div class="gate-dots">' +
            '    <div class="gate-dot" id="g-d0"></div>' +
            '    <div class="gate-dot" id="g-d1"></div>' +
            '    <div class="gate-dot" id="g-d2"></div>' +
            '    <div class="gate-dot" id="g-d3"></div>' +
            '  </div>' +
            '  <div class="gate-pad">' +
            '    <button type="button" class="gate-btn" data-n="1">1</button>' +
            '    <button type="button" class="gate-btn" data-n="2">2</button>' +
            '    <button type="button" class="gate-btn" data-n="3">3</button>' +
            '    <button type="button" class="gate-btn" data-n="4">4</button>' +
            '    <button type="button" class="gate-btn" data-n="5">5</button>' +
            '    <button type="button" class="gate-btn" data-n="6">6</button>' +
            '    <button type="button" class="gate-btn" data-n="7">7</button>' +
            '    <button type="button" class="gate-btn" data-n="8">8</button>' +
            '    <button type="button" class="gate-btn" data-n="9">9</button>' +
            '    <button type="button" class="gate-btn action" id="g-clear">초기화</button>' +
            '    <button type="button" class="gate-btn" data-n="0">0</button>' +
            '    <button type="button" class="gate-btn action" id="g-back">←</button>' +
            '  </div>' +
            '  <div class="gate-err" id="g-err"></div>' +
            '</div>'
          document.body.appendChild(el)

          var input = ''
          var dots = [document.getElementById('g-d0'), document.getElementById('g-d1'), document.getElementById('g-d2'), document.getElementById('g-d3')]
          var errEl = document.getElementById('g-err')
          var card = el.querySelector('.gate-card')

          function render() {
            for (var i = 0; i < 4; i++) {
              if (i < input.length) dots[i].classList.add('fill')
              else dots[i].classList.remove('fill')
            }
            if (input.length === 4) {
              if (input === '0819') {
                try { localStorage.setItem(KEY, '0819') } catch (e) {}
                errEl.textContent = '✨ 인증 성공!'
                errEl.style.color = '#7bf2a6'
                setTimeout(function () {
                  el.classList.add('unlocked')
                  setTimeout(function () { el.remove() }, 360)
                }, 200)
              } else {
                card.classList.add('shake')
                errEl.textContent = '비밀번호가 올바르지 않아요'
                errEl.style.color = '#ff5d8f'
                setTimeout(function () {
                  card.classList.remove('shake')
                  input = ''
                  render()
                }, 450)
              }
            } else {
              errEl.textContent = ''
            }
          }

          el.addEventListener('click', function (e) {
            var btn = e.target.closest('.gate-btn')
            if (!btn) return
            var num = btn.getAttribute('data-n')
            if (num !== null) {
              if (input.length < 4) {
                input += num
                render()
              }
            } else if (btn.id === 'g-clear') {
              input = ''
              render()
            } else if (btn.id === 'g-back') {
              if (input.length > 0) {
                input = input.slice(0, -1)
                render()
              }
            }
          })

          window.addEventListener('keydown', function (e) {
            if (!el.parentNode) return
            if (e.key >= '0' && e.key <= '9') {
              if (input.length < 4) {
                input += e.key
                render()
              }
            } else if (e.key === 'Backspace') {
              if (input.length > 0) {
                input = input.slice(0, -1)
                render()
              }
            } else if (e.key === 'Escape') {
              input = ''
              render()
            }
          })
        })
      })()
    </script>

          <path d="M4 3.5 V9 H9.5" fill="none" stroke="#2B1E4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-exit" viewBox="0 0 24 24">
          <path d="M10 3.5 H5.5 A1.5 1.5 0 0 0 4 5 V19 A1.5 1.5 0 0 0 5.5 20.5 H10" fill="#fff6e5" stroke="#2B1E4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 12 H20 M16.5 8 L20.5 12 L16.5 16" fill="none" stroke="#2B1E4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-gift" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="10.5" rx="2" fill="#FF7EB3" stroke="#2B1E4A" stroke-width="2.2" />
          <rect x="3" y="6.5" width="18" height="4.5" rx="1.6" fill="#FFC93C" stroke="#2B1E4A" stroke-width="2.2" />
          <path d="M12 6.5 V20.5" stroke="#2B1E4A" stroke-width="2.2" />
          <path d="M12 6.5 Q8 1.5 7.5 5 Q8 6.5 12 6.5 Q16 6.5 16.5 5 Q16 1.5 12 6.5" fill="#fff6e5" stroke="#2B1E4A" stroke-width="1.8" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <!-- 로딩 화면: JS 가 올라오기 전부터 보인다. app.js 가 진행 막대(#ld-fill)·퍼센트(#ld-pct)를 채우고 끝나면 걷어 낸다 -->
    <div id="loading">
      <!-- 배경: 햇살 · 구름 · 아래 구름 바닥 · 떠오르는 별/코인 · 떨어지는 색종이 (CSS, 장식 전용) -->
      <div class="ld-bg ld-rays" aria-hidden="true"></div>
      <div class="ld-bg ld-cloud" aria-hidden="true" style="--x:-8%;--y:30%;--w:34vw;--d:11s"></div>
      <div class="ld-bg ld-cloud" aria-hidden="true" style="--x:70%;--y:41%;--w:38vw;--d:13s"></div>
      <div class="ld-bg ld-cloud" aria-hidden="true" style="--x:4%;--y:53%;--w:26vw;--d:9s"></div>
      <div class="ld-bg ld-ground" aria-hidden="true"></div>
      <div class="ld-bg ld-fx" aria-hidden="true">
        <i class="k1" style="--x:8%;--s:16px;--d:7s;--dl:-1s"></i><i class="k2" style="--x:18%;--s:14px;--d:9s;--dl:-5s"></i>
        <i class="k1" style="--x:30%;--s:11px;--d:8s;--dl:-3s"></i><i class="k2" style="--x:42%;--s:16px;--d:10s;--dl:-7s"></i>
        <i class="k1" style="--x:55%;--s:14px;--d:7.5s;--dl:-2s"></i><i class="k2" style="--x:66%;--s:12px;--d:9s;--dl:-6s"></i>
        <i class="k1" style="--x:77%;--s:18px;--d:8.5s;--dl:-4s"></i><i class="k2" style="--x:88%;--s:15px;--d:10s;--dl:-8s"></i>
        <i class="k3" style="--x:6%;--s:15px;--d:6.5s;--dl:-1s;--c:#ff5d8f"></i><i class="k3" style="--x:22%;--s:13px;--d:8s;--dl:-4s;--c:#ffd23c"></i>
        <i class="k3" style="--x:38%;--s:16px;--d:7s;--dl:-2.5s;--c:#3ea8ff"></i><i class="k3" style="--x:52%;--s:12px;--d:9s;--dl:-6s;--c:#ff5d8f"></i>
        <i class="k3" style="--x:64%;--s:15px;--d:7.5s;--dl:-3.5s;--c:#7be0b0"></i><i class="k3" style="--x:80%;--s:14px;--d:8.5s;--dl:-5.5s;--c:#ffd23c"></i>
        <i class="k3" style="--x:92%;--s:13px;--d:6.8s;--dl:-2s;--c:#b48cff"></i>
      </div>
      <!-- 로고: 윗줄 '한 판 더!' + 아랫줄 '인형뽑기'(가장 크게) + 리본 부제. data-t 는 윗부분 하이라이트용 -->
      <div class="ld-top">
        <div class="ld-logo"><svg viewBox="0 0 330 160" role="img" aria-label="한 판 더! 인형뽑기"><defs><linearGradient id="ld-lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbd0" /><stop offset="0.5" stop-color="#ffe55a" /><stop offset="1" stop-color="#ffb81c" /></linearGradient></defs><g><text class="sh" x="165" y="58" font-size="52" data-len="190" stroke-width="10" transform="translate(0 5) rotate(-2 165 40)">한 판 더!</text><text class="sh" x="165" y="140" font-size="80" data-len="296" stroke-width="11" transform="translate(0 5) rotate(1.5 165 110)">인형뽑기</text><text x="165" y="58" font-size="52" data-len="190" stroke-width="10" transform="rotate(-2 165 40)">한 판 더!</text><text x="165" y="140" font-size="80" data-len="296" stroke-width="11" transform="rotate(1.5 165 110)">인형뽑기</text></g></svg></div>
        <div class="ld-sub">ONE MORE GRAB</div>
      </div>
      <!-- 인형뽑기 기계: 분홍 캐비닛 안 유리 상자에 인형 6종(public/loading/*.webp)이 쌓여 있고, 레일의 집게가 --ld-p(진행 0~1)만큼 내려온다. 100% 직후 #loading.ld-grab 이 붙으면 집게가 닫히며 가운데 토끼를 들어 올린다 -->
      <div class="ld-dolls">
        <div class="ld-stage" aria-hidden="true">
          <div class="mc-head"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="mc-glass">
            <div class="mc-in">
              <div class="mc-floor"></div>
              <div class="ldoll back" style="--w:min(42cqw,46cqh);--cx:15cqw;--b:38cqh;--r:-6deg;--pd:0.55s;--dl:0.3s"><div class="bob"><img src="loading/astrobear.webp" alt="" decoding="async" /></div></div>
              <div class="ldoll back" style="--w:min(42cqw,46cqh);--cx:35cqw;--b:42cqh;--r:-3deg;--pd:0.75s;--dl:0.6s"><div class="bob"><img src="loading/bulldog.webp" alt="" decoding="async" /></div></div>
              <div class="ldoll back" style="--w:min(42cqw,46cqh);--cx:85cqw;--b:38cqh;--r:6deg;--pd:0.65s;--dl:0.9s"><div class="bob"><img src="loading/daruma.webp" alt="" decoding="async" /></div></div>
              <div class="ldoll mid" style="--w:min(56cqw,62cqh);--cx:20cqw;--r:-4deg;--pd:0.25s;--dl:1.2s"><i class="ld-sh"></i><div class="bob"><img src="loading/mongle.webp" alt="" decoding="async" /></div></div>
              <div class="ldoll mid" style="--w:min(56cqw,62cqh);--cx:80cqw;--r:4deg;--pd:0.35s;--dl:1.5s"><i class="ld-sh"></i><div class="bob"><img src="loading/toucan.webp" alt="" decoding="async" /></div></div>
              <div class="ldoll hero" style="--w:var(--dh);--cx:50cqw;--r:0deg;--pd:0.05s;--dl:0s"><i class="ld-sh"></i><div class="hl"><div class="bob"><img src="loading/rabbit.webp" alt="" decoding="async" /></div></div></div>
              <i class="ld-sp" style="left:22%;top:24%;--s:12px;--dl:0s"></i>
              <i class="ld-sp" style="left:80%;top:20%;--s:10px;--dl:0.7s"></i>
              <i class="ld-sp" style="left:12%;top:58%;--s:9px;--dl:1.3s"></i>
              <i class="ld-sp" style="left:88%;top:52%;--s:11px;--dl:0.4s"></i>
              <!-- 집게 (닫힘 = .cf 회전). 줄은 ::before -->
              <div class="mc-claw">
                <svg viewBox="0 0 60 72">
                  <defs>
                    <linearGradient id="ld-ch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c5cb0" /><stop offset="0.18" stop-color="#d9d3ff" /><stop offset="0.36" stop-color="#ffffff" /><stop offset="0.55" stop-color="#cbc4f5" /><stop offset="1" stop-color="#7466b8" /></linearGradient>
                    <g id="ld-fg" stroke-linecap="round" stroke-linejoin="round" fill="none">
                      <path d="M17 20 C6 24 3 40 11 55" stroke="#3a1f6e" stroke-width="11" />
                      <path d="M17 20 C6 24 3 40 11 55" stroke="#c9c2f2" stroke-width="7" />
                      <path d="M15.4 21.4 C6.6 25.6 4.6 38 9.6 49" stroke="#fff" stroke-width="1.8" opacity="0.85" />
                      <path d="M7.2 44 C8 49 9.4 52 11 55" stroke="#3a1f6e" stroke-width="12" />
                      <path d="M7.2 44 C8 49 9.4 52 11 55" stroke="#ff5d8f" stroke-width="7.8" />
                      <path d="M5.6 45 C6.2 48 7 50 8 51.6" stroke="#ffc2d6" stroke-width="1.5" opacity="0.9" />
                    </g>
                  </defs>
                  <use class="cf l" href="#ld-fg" />
                  <g transform="translate(60 0) scale(-1 1)"><use class="cf r" href="#ld-fg" /></g>
                  <g stroke="#3a1f6e" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="21" y="16" width="18" height="6" rx="2.5" fill="#6a56b8" stroke-width="2.4" />
                    <rect x="14" y="3.5" width="32" height="15" rx="6" fill="url(#ld-ch)" stroke-width="2.6" />
                    <path d="M16 9.6 H44 M16 13.6 H44" stroke-width="1" opacity="0.35" fill="none" />
                    <rect x="23" y="0.2" width="14" height="5" rx="2" fill="#8a7fd0" stroke-width="2.2" />
                    <circle cx="17" cy="20" r="3.1" fill="#ffd23c" stroke-width="1.8" />
                    <circle cx="43" cy="20" r="3.1" fill="#ffd23c" stroke-width="1.8" />
                    <circle cx="16.2" cy="19.2" r="0.9" fill="#fff" stroke="none" />
                    <circle cx="42.2" cy="19.2" r="0.9" fill="#fff" stroke="none" />
                  </g>
                </svg>
              </div>
              <div class="mc-rail"></div>
              <div class="mc-shine"></div>
            </div>
          </div>
          <div class="mc-base"><i class="mc-joy"></i><span class="mc-btns"><i></i><i></i></span><i class="mc-slot"></i><i class="mc-door"></i></div>
        </div>
      </div>
      <div class="ld-bottom">
        <div id="ld-tip" class="ld-tip"></div>
        <div class="ld-barrow">
          <div class="ld-bar"><div id="ld-fill"></div></div>
          <b id="ld-pct" class="ld-pct">0%</b>
        </div>
        <div id="ld-step" class="ld-step"></div>
        <button id="ld-retry" type="button" class="btn btn-primary" hidden></button>
      </div>
    </div>

    <!-- 가로 화면(휴대폰을 옆으로 돌림)일 때만 보이는 안내 (style.css 의 미디어 쿼리) -->
    <div id="rotate-hint" role="alert">
      <div class="rotate-icon" aria-hidden="true"></div>
      <p>세로로 돌려 주세요</p>
      <p class="sub">이 게임은 세로 화면으로 플레이합니다</p>
    </div>

    <!-- 상단 HUD: 모바일 세로 완벽 대응 2단 슬림 플로팅 (잘림 0%, 여백 확보) -->
    <div id="hud">
      <div class="topbar">
        <div class="hud-left">
          <div class="chip coin-chip" aria-label="코인">
            <svg class="ico"><use href="#i-coin" /></svg><b id="coins" class="num">0</b>
          </div>
          <div class="chip stage-chip" aria-label="스테이지">
            <span class="stage-id num" id="stage-name">1-1</span><span id="stage-country">한국</span>
          </div>
        </div>
        <span class="spacer"></span>
        <div class="hud-right">
          <button type="button" id="reset" class="icon-btn hud-btn" aria-label="스테이지 리셋">
            <svg class="ico"><use href="#i-reset" /></svg><span id="reset-label" class="sr-only">리셋</span>
          </button>
          <button type="button" id="exit" class="icon-btn hud-btn" aria-label="나가기">
            <svg class="ico"><use href="#i-exit" /></svg><span id="exit-label" class="sr-only">나가기</span>
          </button>
        </div>
      </div>
      <div class="questbar">
        <div class="quest-card" id="quest-card" role="button" aria-label="퀘스트">
          <div id="quest-chips" class="qchips"></div>
          <b id="quest-count" class="num" hidden>0/2</b>
        </div>
        <div class="chip mini" aria-label="남은 판">
          <svg class="ico"><use href="#i-claw" /></svg><b id="tries" class="num">0</b>
        </div>
        <div class="chip mini" id="timer-chip" aria-label="남은 시간">
          <svg class="ico"><use href="#i-clock" /></svg><b id="timer" class="num">15</b>
        </div>
      </div>
    </div>

    <div id="toast"></div>
    <!-- 획득 카드: 얻은 인형을 화면 가운데에 크게 (탭하면 닫힘) -->
    <div id="acquire" aria-live="polite">
      <div class="acq-rays"></div>
      <div class="acq-card">
        <button type="button" class="acq-close" id="acquire-close" aria-label="닫기">✕</button>
        <span class="acq-new" hidden>NEW</span>
        <img id="acquire-icon" alt="" />
        <div id="acquire-title"></div>
        <div id="acquire-sub"></div>
      </div>
    </div>
    <div id="app"></div>
    <!-- 앱 화면(홈·스테이지 길·팝업 등)이 올라가는 층. 플레이 화면에서는 비어 있고 아래 3D 캔버스가 보인다 -->
    <div id="screens"></div>

    <!-- 코인 넣기: 입장 뒤 필요한 만큼 10코인씩 넣고 내리기. 투입 잔액과 남은 판 수를 보여 준다 -->
    <div id="insert-bar">
      <div class="chip ins-chip" aria-label="투입 코인">
        <svg class="ico"><use href="#i-coin" /></svg><span id="ins-label">투입</span><b id="ins-amount" class="num">0</b>
      </div>
      <div id="insert">
        <button type="button" class="btn btn-primary ins-opt" data-n="1"></button>
        <button type="button" class="btn btn-primary ins-opt" data-n="4"></button>
        <button type="button" class="btn btn-primary ins-opt" data-n="7"></button>
      </div>
    </div>

    <!-- 하단 조작 영역: 왼쪽 조이스틱 · 가운데 시점 아이콘 · 오른쪽 내리기 -->
    <div id="controls">
      <div id="joystick" aria-label="집게 이동 조이스틱">
        <div id="stick"></div>
      </div>
      <!-- 발 개수 선택 (전설 집게 보유자만 보임): 내리기 왼쪽 맨 아래. 3발·4발 집게 그림 두 개, 고른 쪽이 금색, 누르면 반대쪽으로 -->
      <button type="button" id="fingers" class="fingers-seg" hidden aria-label="집게 발 개수 바꾸기"><span id="fing-3" class="seg"><svg class="fcl" viewBox="0 0 24 30" aria-hidden="true"><rect x="7" y="1.5" width="10" height="7" rx="2.5" fill="currentColor" stroke="none"/><path d="M12 8v16M9.5 8Q3 13 6 26M14.5 8Q21 13 18 26"/></svg></span><span id="fing-4" class="seg"><svg class="fcl" viewBox="0 0 24 30" aria-hidden="true"><rect x="7" y="1.5" width="10" height="7" rx="2.5" fill="currentColor" stroke="none"/><path d="M9.5 8Q3 13 5.5 26M10.5 8Q8 15 9.5 25M13.5 8Q16 15 14.5 25M14.5 8Q21 13 18.5 26"/></svg></span></button>
      <div id="drop-col">
        <div id="rot-row" aria-label="집게 회전">
          <button type="button" id="rot-ccw" class="icon-btn rot-btn" aria-label="집게 왼쪽으로 돌리기"><svg class="ico"><use href="#i-rot-ccw" /></svg></button>
          <button type="button" id="rot-cw" class="icon-btn rot-btn" aria-label="집게 오른쪽으로 돌리기"><svg class="ico"><use href="#i-rot-cw" /></svg></button>
        </div>
        <button id="drop" type="button" class="btn btn-primary"><span>내리기</span></button>
      </div>
    </div>

    <!-- 결과 팝업 -->
    <div id="result" hidden>
      <div class="panel">
        <div class="ribbon"><span id="result-title"></span></div>
        <div id="result-stars" class="stars"></div>
        <div id="result-cards" class="cards"></div>
        <p id="result-detail"></p>
        <div id="result-reward" hidden></div>
        <div class="result-btns">
          <button id="to-map" type="button" class="btn btn-sub"></button>
          <button id="next-stage" type="button" class="btn btn-primary"></button>
        </div>
      </div>
    </div>
  </body>
</html>
